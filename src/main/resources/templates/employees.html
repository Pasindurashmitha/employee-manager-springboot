
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <!-- Dashboard Heading -->
    <header class="dashboard-header">
        <div>
            <h1>Employee Management System</h1>
            <p class="subtitle">
                Manage your employee records easily
            </p>
        </div>

        <a th:href="@{/employees/new}" class="add-button">
            + Add New Employee
        </a>
    </header>

    <!-- Success Message -->
    <div th:if="${successMessage}"
         class="success-message"
         th:text="${successMessage}">
    </div>

    <!-- Employee List Heading -->
    <section class="employee-section">

        <div class="section-heading">
            <div>
                <h2>Employee List</h2>
                <p>View and manage all employee information</p>
            </div>
        </div>

        <!-- Search Form -->
        <form th:action="@{/}" method="get" class="search-form">

            <input
                type="text"
                name="keyword"
                placeholder="Search employee by name..."
                th:value="${keyword}"
            >

            <button type="submit" class="search-button">
                Search
            </button>

            <a th:href="@{/}" class="clear-button">
                Clear
            </a>

        </form>

        <!-- Employee Table -->
        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="employee : ${employees}">

                        <td th:text="${employee.id}"></td>

                        <td th:text="${employee.fullName}"></td>

                        <td th:text="${employee.email}"></td>

                        <td th:text="${employee.phone}"></td>

                        <td th:text="${employee.department}"></td>

                        <td th:text="${employee.salary}"></td>

                        <td class="action-links">

                            <a th:href="@{/employees/edit/{id}(id=${employee.id})}"
                               class="edit-link">
                                Edit
                            </a>

                            <a th:href="@{/employees/delete/{id}(id=${employee.id})}"
                               class="delete-link"
                               onclick="return confirm('Are you sure you want to delete this employee?')">
                                Delete
                            </a>

                        </td>

                    </tr>

                    <!-- No Employees Found -->
                    <tr th:if="${#lists.isEmpty(employees)}">

                        <td colspan="7" class="empty-message">
                            No employees found.
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

        <!-- Employee Count -->
        <div class="employee-count">

            Total employees:
            <strong th:text="${#lists.size(employees)}">0</strong>

        </div>

    </section>

</div>

</body>
</html>
